<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VWAP / 9 EMA Long Scanner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9f9f8; color: #1a1a1a; font-size: 14px; }
  .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card { background: #fff; border: 1px solid #e5e5e3; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label { font-size: 12px; color: #666; white-space: nowrap; }
  input[type=text], input[type=number] { padding: 7px 10px; border: 1px solid #d5d5d3; border-radius: 7px; font-size: 13px; background: #fff; color: #1a1a1a; outline: none; }
  input:focus { border-color: #999; }
  input.ticker-in { width: 110px; text-transform: uppercase; }
  input.num-in { width: 110px; }
  button { padding: 7px 14px; border: 1px solid #d5d5d3; border-radius: 7px; background: #fff; color: #1a1a1a; font-size: 13px; cursor: pointer; }
  button:hover { background: #f3f3f1; }
  button.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  button.primary:hover { background: #333; }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; animation: pulse 1.2s infinite; flex-shrink: 0; }
  .live-dot.paused { background: #f59e0b; animation: none; }
  .live-dot.off { background: #aaa; animation: none; }
  .live-dot.closed { background: #e24b4a; animation: none; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }
  .market-pill { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; }
  .market-open { background: #dcfce7; color: #15803d; }
  .market-closed { background: #fee2e2; color: #b91c1c; }
  .market-pre { background: #fef9c3; color: #854d0e; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { display: flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; background: #f3f3f1; border: 1px solid #e5e5e3; font-size: 12px; font-weight: 600; }
  .chip .rm { cursor: pointer; color: #999; font-size: 16px; line-height: 1; }
  .chip .rm:hover { color: #e24b4a; }
  .topbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .countdown-bar-bg { height: 3px; background: #e5e5e3; border-radius: 2px; margin-bottom: 10px; overflow: hidden; display: none; }
  .countdown-bar { height: 3px; background: #22c55e; border-radius: 2px; transition: width 1s linear; }
  .tbl-wrap { overflow-x: auto; background: #fff; border: 1px solid #e5e5e3; border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; padding: 9px 12px; color: #888; border-bottom: 1px solid #e5e5e3; font-weight: 600; font-size: 11px; white-space: nowrap; background: #fafaf9; }
  th.r, td.r { text-align: right; }
  tbody tr { border-bottom: 1px solid #f0f0ee; transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafaf9; }
  tbody tr.coiling { background: #fefce8; }
  tbody tr.coiling:hover { background: #fef9c3; }
  tbody tr.entry { background: #f0fdf4; }
  tbody tr.entry:hover { background: #dcfce7; }
  tbody tr.watch { background: #f0f9ff; }
  td { padding: 9px 12px; white-space: nowrap; }
  .sym { font-weight: 700; font-size: 14px; }
  .up { color: #16a34a; } .dn { color: #dc2626; } .neu { color: #888; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 600; }
  .b-entry { background: #dcfce7; color: #15803d; }
  .b-coil { background: #fef08a; color: #854d0e; }
  .b-watch { background: #e0f2fe; color: #075985; }
  .b-ok { background: #f3f3f1; color: #888; }
  .slope-up { color: #16a34a; font-weight: 600; }
  .slope-dn { color: #dc2626; font-weight: 600; }
  .slope-flat { color: #888; }
  .banner { border-radius: 8px; padding: 9px 14px; margin-bottom: 10px; font-size: 13px; display: none; font-weight: 500; }
  .banner-entry { background: #f0fdf4; border: 1px solid #86efac; color: #15803d; }
  .banner-coil { background: #fefce8; border: 1px solid #fbbf24; color: #854d0e; }
  .banner-info { background: #f3f3f1; border: 1px solid #e5e5e3; color: #666; }
  .banner-err { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; }
  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; flex-wrap: wrap; gap: 6px; }
  .foot-txt { font-size: 11px; color: #aaa; }
  .dimmed { opacity: .35; }
  .status-txt { font-size: 12px; color: #888; }
</style>
</head>
<body>
<div class="container">

  <h1>
    <div class="live-dot off" id="dot"></div>
    VWAP / 9 EMA — Long Scanner
    <span class="market-pill market-closed" id="marketPill">Checking…</span>
  </h1>

  <div class="card">
    <div class="row">
      <label>Add ticker</label>
      <input class="ticker-in" type="text" id="addInput" placeholder="e.g. NVDA" maxlength="6" onkeydown="if(event.key==='Enter')addTicker()">
      <button onclick="addTicker()">+ Add</button>
      <label style="margin-left:12px">AVOL min</label>
      <input class="num-in" type="number" id="avolMin" value="10000000">
      <label>ATR min</label>
      <input class="num-in" type="number" id="atrMin" value="2" style="width:70px">
      <button class="primary" onclick="startScan()" id="startBtn">▶ Start</button>
    </div>
  </div>

  <div class="banner banner-entry" id="entryBanner"></div>
  <div class="banner banner-coil" id="coilBanner"></div>
  <div class="banner banner-info" id="infoBanner"></div>
  <div class="banner banner-err" id="errBanner"></div>

  <div class="topbar">
    <span class="status-txt" id="statusTxt"></span>
    <div style="display:flex;gap:8px">
      <button onclick="togglePause()" id="pauseBtn" style="display:none">⏸ <span id="pauseTxt">Pause</span></button>
      <button onclick="forceRefresh()" id="refreshBtn" style="display:none">↻ Refresh now</button>
    </div>
  </div>

  <div class="countdown-bar-bg" id="barBg">
    <div class="countdown-bar" id="countdownBar" style="width:100%"></div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:80px">Symbol</th>
          <th class="r" style="width:85px">Price</th>
          <th class="r" style="width:85px">VWAP</th>
          <th class="r" style="width:85px">9 EMA</th>
          <th class="r" style="width:100px">VWAP−9EMA</th>
          <th class="r" style="width:80px">Slope</th>
          <th class="r" style="width:85px">AVOL</th>
          <th class="r" style="width:70px">ATR</th>
          <th class="r" style="width:105px">Status</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="9" style="text-align:center;padding:2.5rem;color:#aaa">Press Start to begin scanning</td></tr>
      </tbody>
    </table>
  </div>

  <div class="foot">
    <span class="foot-txt" id="lastUpdate"></span>
    <span class="foot-txt" id="nextUpdate"></span>
  </div>

</div>
<script>
const API_KEY = 'd831uuhr01ql4onfulmgd831uuhr01ql4onfuln0';

let tickers = ['AAPL','MSFT','NVDA','TSLA','AMD','MARA','COIN','PLTR'];
let emaHistory = {}, prevEMA9 = {}, prevVWAP = {}, rowData = {};
let paused = false, running = false, secondsLeft = 60;
let countdownInterval;

function getETTime() {
  return new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
}
function getMarketStatus() {
  const et = getETTime();
  const day = et.getDay();
  if (day === 0 || day === 6) return 'weekend';
  const mins = et.getHours() * 60 + et.getMinutes();
  if (mins < 570) return 'pre';
  if (mins >= 960) return 'closed';
  return 'open';
}
function isMarketOpen() { return getMarketStatus() === 'open'; }

function updateMarketPill() {
  const status = getMarketStatus();
  const pill = document.getElementById('marketPill');
  const et = getETTime();
  const t = et.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  if (status === 'open') { pill.className = 'market-pill market-open'; pill.textContent = 'Market open · ' + t + ' ET'; }
  else if (status === 'pre') { pill.className = 'market-pill market-pre'; pill.textContent = 'Pre-market · ' + t + ' ET'; }
  else { pill.className = 'market-pill market-closed'; pill.textContent = (status === 'weekend' ? 'Weekend' : 'After hours') + ' · ' + t + ' ET'; }
}

function renderChips() {
  document.getElementById('chips').innerHTML = tickers.map(s =>
    `<div class="chip">${s}<span class="rm" onclick="removeTicker('${s}')">×</span></div>`
  ).join('');
}

function addTicker() {
  const inp = document.getElementById('addInput');
  const sym = inp.value.trim().toUpperCase().replace(/[^A-Z]/g, '');
  if (!sym || tickers.includes(sym)) { inp.value = ''; return; }
  tickers.push(sym); inp.value = '';
  renderChips();
  if (running) fetchAll();
}

function removeTicker(sym) {
  tickers = tickers.filter(t => t !== sym);
  delete emaHistory[sym]; delete rowData[sym];
  delete prevEMA9[sym]; delete prevVWAP[sym];
  renderChips(); renderTable();
}

function calcEMA(price, prev, period) {
  const k = 2 / (period + 1);
  return (prev == null) ? price : price * k + prev * (1 - k);
}

async function fetchCandles(sym) {
  const now = Math.floor(Date.now() / 1000);
  const from = now - 60 * 60 * 8;
  const url = `https://finnhub.io/api/v1/stock/candle?symbol=${sym}&resolution=5&from=${from}&to=${now}&token=${API_KEY}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function fetchQuote(sym) {
  const url = `https://finnhub.io/api/v1/quote?symbol=${sym}&token=${API_KEY}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function computeVWAP(c) {
  if (!c || c.s !== 'ok' || !c.c) return null;
  let tpv = 0, tv = 0;
  for (let i = 0; i < c.c.length; i++) {
    if (c.c[i] == null || c.v[i] == null) continue;
    const tp = (c.h[i] + c.l[i] + c.c[i]) / 3;
    tpv += tp * c.v[i]; tv += c.v[i];
  }
  return tv ? tpv / tv : null;
}

function computeATR(c, period = 14) {
  if (!c || c.s !== 'ok' || !c.c || c.c.length < 2) return null;
  const trs = [];
  for (let i = 1; i < c.c.length; i++) {
    if (c.c[i] == null || c.c[i-1] == null) continue;
    trs.push(Math.max(c.h[i] - c.l[i], Math.abs(c.h[i] - c.c[i-1]), Math.abs(c.l[i] - c.c[i-1])));
  }
  const sl = trs.slice(-period);
  return sl.length ? sl.reduce((a, b) => a + b, 0) / sl.length : null;
}

function computeAVOL(c, bars = 20) {
  if (!c || c.s !== 'ok' || !c.v) return null;
  const sl = c.v.filter(v => v != null).slice(-bars);
  return sl.length ? sl.reduce((a, b) => a + b, 0) / sl.length : null;
}

function compute9EMA(c, sym) {
  if (!c || c.s !== 'ok' || !c.c) return null;
  if (!emaHistory[sym]) emaHistory[sym] = [];
  let ema = emaHistory[sym].length ? emaHistory[sym][emaHistory[sym].length - 1] : null;
  for (let i = 0; i < c.c.length; i++) {
    if (c.c[i] == null) continue;
    ema = calcEMA(c.c[i], ema, 9);
    emaHistory[sym].push(ema);
  }
  if (emaHistory[sym].length > 10) emaHistory[sym] = emaHistory[sym].slice(-10);
  return ema;
}

function getSlope(sym) {
  const h = emaHistory[sym];
  if (!h || h.length < 3) return 'flat';
  const delta = h[h.length - 1] - h[h.length - 3];
  if (delta > 0.01) return 'up';
  if (delta < -0.01) return 'down';
  return 'flat';
}

function showBanner(id, msg) {
  const b = document.getElementById(id);
  if (msg) { b.style.display = 'block'; b.innerHTML = msg; } else b.style.display = 'none';
}

async function fetchAll() {
  if (!isMarketOpen()) { showClosedState(); return; }
  showBanner('errBanner', ''); showBanner('infoBanner', '');
  const avolMin = parseFloat(document.getElementById('avolMin').value) || 10000000;
  const atrMin = parseFloat(document.getElementById('atrMin').value) || 2;
  let entries = [], coiling = [], watching = [];

  await Promise.all(tickers.map(async sym => {
    try {
      const [quote, candles] = await Promise.all([fetchQuote(sym), fetchCandles(sym)]);
      const price = quote.c;
      const vwap = computeVWAP(candles);
      const ema9 = compute9EMA(candles, sym);
      const atr = computeATR(candles);
      const avol = computeAVOL(candles);
      if (!price || !vwap || !ema9) { rowData[sym] = null; return; }

      const diff = vwap - ema9;
      const threshold = price * 0.05;
      const passesFilters = (avol || 0) >= avolMin && (atr || 0) >= atrMin;
      const slope = getSlope(sym);

      let crossedUp = false;
      const pEMA = prevEMA9[sym], pVWAP = prevVWAP[sym];
      if (pEMA !== undefined && pVWAP !== undefined) {
        if (pEMA < pVWAP && ema9 >= vwap) crossedUp = true;
      }

      const isEntry = crossedUp && slope === 'up' && passesFilters;
      const isWatch = crossedUp && slope !== 'up' && passesFilters;
      const isCoiling = !crossedUp && Math.abs(diff) < threshold && slope === 'up' && passesFilters;

      if (isEntry) entries.push(sym);
      else if (isWatch) watching.push(sym);
      else if (isCoiling) coiling.push(sym);

      prevEMA9[sym] = ema9; prevVWAP[sym] = vwap;
      rowData[sym] = { price, vwap, ema9, diff, atr, avol, slope, isEntry, isWatch, isCoiling, passesFilters };
    } catch (e) {
      rowData[sym] = { error: e.message };
    }
  }));

  renderTable();
  showBanner('entryBanner', entries.length
    ? `▲ <strong>LONG ENTRY:</strong> ${entries.join(', ')} — 9 EMA crossed above VWAP, upslope confirmed`
    : watching.length ? `👁 <strong>Watch:</strong> ${watching.join(', ')} — crossed VWAP, slope not yet confirmed` : '');
  showBanner('coilBanner', coiling.length
    ? `⏳ <strong>Coiling:</strong> ${coiling.join(', ')} — 9 EMA upsloping, within 5% of VWAP` : '');
  document.getElementById('lastUpdate').textContent = 'Updated: ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function showClosedState() {
  const status = getMarketStatus();
  const msg = status === 'pre' ? '⏳ Pre-market — scanner auto-starts at 9:30 AM ET'
    : status === 'closed' ? '🌙 Market closed — resumes 9:30 AM ET'
    : '🌙 Weekend — resumes Monday 9:30 AM ET';
  showBanner('infoBanner', msg);
  showBanner('entryBanner', ''); showBanner('coilBanner', '');
  document.getElementById('dot').className = 'live-dot closed';
  document.getElementById('statusTxt').textContent = 'Waiting for market open';
}

function fmtAvol(v) {
  if (!v) return '—';
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(0) + 'K';
  return v.toFixed(0);
}

function renderTable() {
  if (!tickers.length) {
    document.getElementById('tbody').innerHTML = '<tr><td colspan="9" style="text-align:center;padding:2.5rem;color:#aaa">No tickers added</td></tr>';
    return;
  }
  document.getElementById('tbody').innerHTML = tickers.map(sym => {
    const d = rowData[sym];
    if (!d) return `<tr><td class="sym">${sym}</td><td colspan="8" style="color:#aaa;font-size:12px">Loading…</td></tr>`;
    if (d.error) return `<tr><td class="sym">${sym}</td><td colspan="8" style="color:#dc2626;font-size:12px">Error: ${d.error}</td></tr>`;
    const priceClr = d.price > d.vwap ? 'up' : d.price < d.vwap ? 'dn' : 'neu';
    const diffSign = d.diff >= 0 ? '+' : '';
    const diffClr = d.diff >= 0 ? 'up' : 'dn';
    const slopeHtml = d.slope === 'up' ? `<span class="slope-up">↑ Up</span>`
      : d.slope === 'down' ? `<span class="slope-dn">↓ Down</span>` : `<span class="slope-flat">→ Flat</span>`;
    let rowCls = '', badge = '';
    if (d.isEntry) { rowCls = 'entry'; badge = `<span class="badge b-entry">▲ Enter long</span>`; }
    else if (d.isWatch) { rowCls = 'watch'; badge = `<span class="badge b-watch">👁 Watch</span>`; }
    else if (d.isCoiling) { rowCls = 'coiling'; badge = `<span class="badge b-coil">⏳ Coiling</span>`; }
    else { badge = `<span class="badge b-ok">—</span>`; }
    return `<tr class="${rowCls} ${!d.passesFilters ? 'dimmed' : ''}">
      <td class="sym">${sym}</td>
      <td class="r ${priceClr}">$${d.price.toFixed(2)}</td>
      <td class="r">$${d.vwap.toFixed(2)}</td>
      <td class="r">$${d.ema9.toFixed(2)}</td>
      <td class="r ${diffClr}">${diffSign}$${d.diff.toFixed(2)}</td>
      <td class="r">${slopeHtml}</td>
      <td class="r">${fmtAvol(d.avol)}</td>
      <td class="r">${d.atr ? d.atr.toFixed(2) : '—'}</td>
      <td class="r">${badge}</td>
    </tr>`;
  }).join('');
}

function startCountdown() {
  clearInterval(countdownInterval);
  secondsLeft = 60;
  document.getElementById('barBg').style.display = 'block';
  countdownInterval = setInterval(() => {
    updateMarketPill();
    if (paused) return;
    secondsLeft--;
    document.getElementById('countdownBar').style.width = Math.max(0, (secondsLeft / 60) * 100) + '%';
    document.getElementById('nextUpdate').textContent = `Next refresh in ${secondsLeft}s`;
    if (secondsLeft <= 0) { secondsLeft = 60; fetchAll(); }
  }, 1000);
}

function startScan() {
  running = true;
  document.getElementById('startBtn').textContent = '↺ Restart';
  document.getElementById('pauseBtn').style.display = '';
  document.getElementById('refreshBtn').style.display = '';
  document.getElementById('dot').className = 'live-dot';
  document.getElementById('statusTxt').textContent = '';
  fetchAll();
  startCountdown();
}

function togglePause() {
  paused = !paused;
  if (paused) {
    document.getElementById('dot').className = 'live-dot paused';
    document.getElementById('pauseTxt').textContent = 'Resume';
    document.getElementById('statusTxt').textContent = '⏸ Paused';
    document.getElementById('countdownBar').style.background = '#f59e0b';
  } else {
    document.getElementById('dot').className = 'live-dot';
    document.getElementById('pauseTxt').textContent = 'Pause';
    document.getElementById('statusTxt').textContent = '';
    document.getElementById('countdownBar').style.background = '#22c55e';
    fetchAll();
  }
}

function forceRefresh() { secondsLeft = 60; fetchAll(); }

renderChips();
renderTable();
updateMarketPill();
setInterval(updateMarketPill, 10000);
</script>
</body>
</html>
